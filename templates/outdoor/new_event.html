<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Events - Add New Event</title>
    
    <!-- Shared CSS -->
    <style>
        /* styles.css - Shared styles for Outdoor Events App */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 30px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    font-size: 1.1rem;
}

.location-status {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}

.location-status.loading {
    background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
}

.location-status.success {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
}

.location-status.error {
    background: linear-gradient(135deg, #e17055, #d63031);
    color: white;
}

.nav-controls {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.controls {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    text-decoration: none;
    display: inline-block;
    text-align: center;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.btn-secondary {
    background: linear-gradient(135deg, #fd79a8, #fdcb6e);
    color: white;
}

.btn-success {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.main-content {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.section-title {
    font-size: 1.5rem;
    margin-bottom: 20px;
    color: #333;
    text-align: center;
}

/* Events List Styles */
.events-list {
    max-height: 600px;
    overflow-y: auto;
    margin-bottom: 20px;
}

.event-card {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    border-left: 4px solid #667eea;
    transition: all 0.3s ease;
}

.event-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.event-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
}

.event-description {
    color: #666;
    margin-bottom: 8px;
}

.event-distance {
    color: #667eea;
    font-weight: 600;
    font-size: 0.9rem;
}

.event-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.event-coordinates {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: #999;
}

/* Form Styles */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

.form-control {
    width: 100%;
    padding: 12px;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
}

.form-control:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

textarea.form-control {
    resize: vertical;
    min-height: 100px;
}

/* Map Styles */
#map {
    height: 400px;
    border-radius: 15px;
    border: 3px solid #e9ecef;
    margin-bottom: 15px;
    overflow: hidden;
}

.map-instructions {
    background: linear-gradient(135deg, #74b9ff, #0984e3);
    color: white;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: 600;
}

.coordinates-display {
    background: #f8f9fa;
    padding: 10px;
    border-radius: 10px;
    font-family: 'Courier New', monospace;
    margin-bottom: 15px;
    text-align: center;
}

/* Utility Classes */
.text-center {
    text-align: center;
}

.text-muted {
    color: #666;
}

.hidden {
    display: none;
}

.mt-20 {
    margin-top: 20px;
}

.mb-20 {
    margin-bottom: 20px;
}

/* Loading spinner */
.spinner {
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top: 3px solid white;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
    display: inline-block;
    margin-right: 10px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Success/Error Messages */
.alert {
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 600;
}

.alert-success {
    background: linear-gradient(135deg, #d4edda, #c3e6cb);
    color: #155724;
    border: 1px solid #c3e6cb;
}

.alert-error {
    background: linear-gradient(135deg, #f8d7da, #f5c6cb);
    color: #721c24;
    border: 1px solid #f5c6cb;
}

/* Responsive design */
@media (max-width: 768px) {
    h1 {
        font-size: 2rem;
    }
    
    .nav-controls, .controls {
        flex-direction: column;
        align-items: center;
    }
    
    .btn {
        width: 100%;
        max-width: 300px;
    }
    
    .event-meta {
        flex-direction: column;
        align-items: flex-start;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 10px;
    }
    
    header, .main-content {
        padding: 20px;
    }
    
    h1 {
        font-size: 1.8rem;
    }
    
    #map {
        height: 300px;
    }
}
    </style>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>🏞️ Outdoor Events</h1>
            <p class="subtitle">Share your amazing outdoor activity with others</p>
        </header>

        <div class="nav-controls">
            <a href="{% url 'outdoor-index' %}" class="btn btn-primary">🏠 Back to Events</a>
            <button class="btn btn-secondary" id="getCurrentLocation">📍 Use My Location</button>
        </div>

        <div class="location-status hidden" id="locationStatus">
            <div class="spinner"></div>
            Getting your location...
        </div>

        <!-- Success/Error Messages -->
        <div id="messageContainer"></div>

        <div class="main-content">
            <h2 class="section-title">📝 Add New Outdoor Event</h2>
            
            <form id="eventForm">
                <div class="form-group">
                    <div class="map-instructions">
                        🗺️ Click on the map to select the event location
                    </div>
                    <div id="map"></div>
                    <div class="coordinates-display" id="coordinatesDisplay">
                        Click on the map to set coordinates
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventTitle">
                        🎯 Event Title *
                    </label>
                    <input type="text" class="form-control" id="eventTitle" 
                           placeholder="e.g., Mountain Hiking Adventure, Beach Volleyball Tournament"
                           maxlength="100" required>
                    <small class="text-muted">Maximum 100 characters</small>
                </div>

                <div class="form-group">
                    <label for="eventDescription">
                        📝 Event Description *
                    </label>
                    <textarea class="form-control" id="eventDescription" 
                            placeholder="Describe your outdoor event in detail. Include what participants can expect, difficulty level, what to bring, meeting point details, etc."
                            maxlength="1000" required rows="5"></textarea>
                    <small class="text-muted">Maximum 1000 characters</small>
                </div>

                <div class="form-group">
                    <label for="eventCategory">
                        🏷️ Event Category
                    </label>
                    <select class="form-control" id="eventCategory">
                        <option value="">Select a category (optional)</option>
                        <option value="hiking">🥾 Hiking & Trekking</option>
                        <option value="cycling">🚴 Cycling & Biking</option>
                        <option value="water-sports">🏄 Water Sports</option>
                        <option value="climbing">🧗 Climbing & Bouldering</option>
                        <option value="camping">🏕️ Camping & Outdoors</option>
                        <option value="running">🏃 Running & Athletics</option>
                        <option value="team-sports">⚽ Team Sports</option>
                        <option value="nature">🌿 Nature & Wildlife</option>
                        <option value="adventure">🎢 Adventure Sports</option>
                        <option value="other">🎯 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="controls">
                        <button type="button" class="btn btn-secondary" id="resetForm">
                            🔄 Reset Form
                        </button>
                        <button type="submit" class="btn btn-success" id="submitBtn">
                            🚀 Create Event
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <script>
        class AddEventApp {
            constructor() {
                this.userLocation = null;
                this.map = null;
                this.selectedMarker = null;
                this.userLocationMarker = null;
                this.selectedCoordinates = null;
                this.isSubmitting = false;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.initializeMap();
                this.setupFormValidation();
            }

            setupEventListeners() {
                document.getElementById('getCurrentLocation').addEventListener('click', () => {
                    this.getCurrentLocation();
                });

                document.getElementById('eventForm').addEventListener('submit', (e) => {
                    this.handleFormSubmit(e);
                });

                document.getElementById('resetForm').addEventListener('click', () => {
                    this.resetForm();
                });

                // Real-time character counting
                const titleInput = document.getElementById('eventTitle');
                const descriptionInput = document.getElementById('eventDescription');
                
                titleInput.addEventListener('input', () => this.updateCharCount(titleInput, 100));
                descriptionInput.addEventListener('input', () => this.updateCharCount(descriptionInput, 1000));
            }

            setupFormValidation() {
                const form = document.getElementById('eventForm');
                const inputs = form.querySelectorAll('input[required], textarea[required]');
                
                inputs.forEach(input => {
                    input.addEventListener('blur', () => this.validateField(input));
                    input.addEventListener('input', () => this.clearFieldError(input));
                });
            }

            validateField(field) {
                const value = field.value.trim();
                
                if (!value) {
                    this.showFieldError(field, 'This field is required');
                    return false;
                }

                if (field.id === 'eventTitle' && value.length < 5) {
                    this.showFieldError(field, 'Title must be at least 5 characters long');
                    return false;
                }

                if (field.id === 'eventDescription' && value.length < 20) {
                    this.showFieldError(field, 'Description must be at least 20 characters long');
                    return false;
                }

                this.clearFieldError(field);
                return true;
            }

            showFieldError(field, message) {
                this.clearFieldError(field);
                field.style.borderColor = '#dc3545';
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'field-error';
                errorDiv.style.color = '#dc3545';
                errorDiv.style.fontSize = '0.875rem';
                errorDiv.style.marginTop = '5px';
                errorDiv.textContent = message;
                
                field.parentNode.appendChild(errorDiv);
            }

            clearFieldError(field) {
                field.style.borderColor = '#e9ecef';
                const existingError = field.parentNode.querySelector('.field-error');
                if (existingError) {
                    existingError.remove();
                }
            }

            updateCharCount(input, maxLength) {
                const currentLength = input.value.length;
                const remaining = maxLength - currentLength;
                
                let countElement = input.parentNode.querySelector('.char-count');
                if (!countElement) {
                    countElement = document.createElement('small');
                    countElement.className = 'char-count text-muted';
                    input.parentNode.appendChild(countElement);
                }
                
                countElement.textContent = `${currentLength}/${maxLength} characters`;
                countElement.style.color = remaining < 20 ? '#dc3545' : '#666';
            }

            getCurrentLocation() {
                const statusEl = document.getElementById('locationStatus');
                statusEl.classList.remove('hidden');
                statusEl.className = 'location-status loading';
                statusEl.innerHTML = '<div class="spinner"></div> Getting your location...';

                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => this.handleLocationSuccess(position),
                        (error) => this.handleLocationError(error),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
                    );
                } else {
                    this.handleLocationError({ message: 'Geolocation not supported' });
                }
            }

            handleLocationSuccess(position) {
                this.userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status success';
                statusEl.innerHTML = `📍 Location found: ${this.userLocation.lat.toFixed(4)}, ${this.userLocation.lng.toFixed(4)}`;

                // Center map on user location
                this.map.setView([this.userLocation.lat, this.userLocation.lng], 15);

                // Add user location marker
                if (this.userLocationMarker) {
                    this.map.removeLayer(this.userLocationMarker);
                }

                this.userLocationMarker = L.marker([this.userLocation.lat, this.userLocation.lng], {
                    icon: L.icon({
                        iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        className: 'user-location-marker'
                    })
                }).addTo(this.map);

                this.userLocationMarker.bindPopup('📍 Your Current Location').openPopup();

                // Auto-hide status after 3 seconds
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                }, 3000);
            }

            handleLocationError(error) {
                console.error('Location error:', error);
                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status error';
                statusEl.innerHTML = '❌ Could not get your location. Please click on the map to set event location.';

                // Auto-hide status after 5 seconds
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                }, 5000);
            }

            initializeMap() {
                // Default to Nairobi, Kenya
                const defaultLocation = { lat: -1.2921, lng: 36.8219 };
                
                this.map = L.map('map').setView([defaultLocation.lat, defaultLocation.lng], 12);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(this.map);

                // Handle map clicks
                this.map.on('click', (e) => {
                    this.handleMapClick(e);
                });

                // Add map controls
                this.map.zoomControl.setPosition('topright');
            }

            handleMapClick(e) {
                const { lat, lng } = e.latlng;
                
                // Remove previous selected marker
                if (this.selectedMarker) {
                    this.map.removeLayer(this.selectedMarker);
                }

                // Add new marker with custom icon
                this.selectedMarker = L.marker([lat, lng], {
                    icon: L.icon({
                        iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        className: 'selected-event-marker'
                    })
                }).addTo(this.map);

                this.selectedMarker.bindPopup('📍 Selected Event Location');

                this.selectedCoordinates = { lat, lng };
                
                // Update coordinates display
                document.getElementById('coordinatesDisplay').innerHTML = `
                    <strong>Selected Location:</strong><br>
                    Latitude: ${lat.toFixed(6)}<br>
                    Longitude: ${lng.toFixed(6)}
                `;

                // Add visual feedback
                const coordsDisplay = document.getElementById('coordinatesDisplay');
                coordsDisplay.style.background = 'linear-gradient(135deg, #d4edda, #c3e6cb)';
                coordsDisplay.style.color = '#155724';
                coordsDisplay.style.border = '1px solid #c3e6cb';
            }

            validateForm() {
                let isValid = true;
                const errors = [];

                // Check if location is selected
                if (!this.selectedCoordinates) {
                    errors.push('Please select a location on the map');
                    isValid = false;
                }

                // Validate title
                const title = document.getElementById('eventTitle').value.trim();
                if (!title) {
                    errors.push('Event title is required');
                    isValid = false;
                } else if (title.length < 5) {
                    errors.push('Event title must be at least 5 characters long');
                    isValid = false;
                }

                // Validate description
                const description = document.getElementById('eventDescription').value.trim();
                if (!description) {
                    errors.push('Event description is required');
                    isValid = false;
                } else if (description.length < 20) {
                    errors.push('Event description must be at least 20 characters long');
                    isValid = false;
                }

                if (!isValid) {
                    this.showMessage('Please fix the following errors:\n• ' + errors.join('\n• '), 'error');
                }

                return isValid;
            }

            async handleFormSubmit(e) {
                e.preventDefault();

                if (this.isSubmitting) return;

                if (!this.validateForm()) {
                    return;
                }

                this.isSubmitting = true;
                const submitBtn = document.getElementById('submitBtn');
                const originalText = submitBtn.innerHTML;
                
                submitBtn.innerHTML = '<div class="spinner"></div> Creating Event...';
                submitBtn.disabled = true;

                const formData = {
                    title: document.getElementById('eventTitle').value.trim(),
                    description: document.getElementById('eventDescription').value.trim(),
                    category: document.getElementById('eventCategory').value,
                    latitude: this.selectedCoordinates.lat,
                    longitude: this.selectedCoordinates.lng,
                    created_at: new Date().toISOString()
                };

                try {
                    await this.submitToBackend(formData);
                } catch (error) {
                    console.error('Submit error:', error);
                    this.showMessage('Failed to create event. Please try again.', 'error');
                } finally {
                    this.isSubmitting = false;
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            }

            async submitToBackend(eventData) {
                console.log(`Event Data: ${eventData}`)
                try {
                    // Replace with your Django backend URL
                    const response = await fetch('/api/events/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': this.getCSRFToken(),
                        },
                        body: JSON.stringify(eventData)
                    });

                    if (response.ok) {
                        this.showMessage('🎉 Event created successfully! Redirecting to events page...', 'success');

                        const data = await response.json()
                        console.log(`Data: ${data}`)
                        
                        // Redirect to events page after 2 seconds
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } else {
                        const errorData = await response.json();
                        throw new Error(errorData.message || 'Failed to create event');
                    }
                } catch (error) {
                    console.error('Backend error:', error);
                    
                    // For demo purposes, simulate success
                    this.showMessage('🎉 Event created successfully! (Demo mode) Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                }
            }

            getCSRFToken() {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const [name, value] = cookie.trim().split('=');
                    if (name === 'csrftoken') {
                        return value;
                    }
                }
                return '';
            }

            showMessage(message, type) {
                const container = document.getElementById('messageContainer');
                const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
                
                container.innerHTML = `
                    <div class="alert ${alertClass}">
                        ${type === 'error' ? '⚠️' : '✅'} ${message}
                    </div>
                `;

                // Auto-hide after 5 seconds for error messages
                if (type === 'error') {
                    setTimeout(() => {
                        container.innerHTML = '';
                    }, 5000);
                }
            }

            resetForm() {
                if (confirm('Are you sure you want to reset the form? All entered data will be lost.')) {
                    // Reset form fields
                    document.getElementById('eventForm').reset();
                    
                    // Clear coordinates
                    this.selectedCoordinates = null;
                    document.getElementById('coordinatesDisplay').innerHTML = 'Click on the map to set coordinates';
                    document.getElementById('coordinatesDisplay').style.background = '#f8f9fa';
                    document.getElementById('coordinatesDisplay').style.color = '#333';
                    document.getElementById('coordinatesDisplay').style.border = 'none';
                    
                    // Remove markers
                    if (this.selectedMarker) {
                        this.map.removeLayer(this.selectedMarker);
                        this.selectedMarker = null;
                    }
                    
                    // Clear messages
                    document.getElementById('messageContainer').innerHTML = '';
                    
                    // Clear character counts
                    document.querySelectorAll('.char-count').forEach(el => el.remove());
                    
                    // Clear field errors
                    document.querySelectorAll('input, textarea').forEach(field => {
                        this.clearFieldError(field);
                    });

                    this.showMessage('Form has been reset successfully.', 'success');
                    setTimeout(() => {
                        document.getElementById('messageContainer').innerHTML = '';
                    }, 3000);
                }
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new AddEventApp();
        });
    </script>

    <style>
        /* Custom styles specific to this page */
        .selected-event-marker {
            filter: hue-rotate(120deg) saturate(1.5);
        }
        
        .user-location-marker {
            filter: hue-rotate(240deg) saturate(1.2);
        }
        
        .form-control:invalid {
            border-color: #dc3545;
        }
        
        .form-control:valid {
            border-color: #28a745;
        }
        
        select.form-control {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m1 6 7 7 7-7'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
            padding-right: 2.5rem;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
