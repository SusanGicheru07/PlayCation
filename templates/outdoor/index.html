<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Events - Browse Events</title>
    
    <!-- Shared CSS -->
    <style>
        /* styles.css - Shared styles for Outdoor Events App */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 30px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    font-size: 1.1rem;
}

.location-status {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}

.location-status.loading {
    background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
}

.location-status.success {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
}

.location-status.error {
    background: linear-gradient(135deg, #e17055, #d63031);
    color: white;
}

.nav-controls {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.controls {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    text-decoration: none;
    display: inline-block;
    text-align: center;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.btn-secondary {
    background: linear-gradient(135deg, #fd79a8, #fdcb6e);
    color: white;
}

.btn-success {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.main-content {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}

.section-title {
    font-size: 1.5rem;
    margin-bottom: 20px;
    color: #333;
    text-align: center;
}

/* Events List Styles */
.events-list {
    max-height: 600px;
    overflow-y: auto;
    margin-bottom: 20px;
}

.event-card {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    border-left: 4px solid #667eea;
    transition: all 0.3s ease;
}

.event-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.event-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
}

.event-description {
    color: #666;
    margin-bottom: 8px;
}

.event-distance {
    color: #667eea;
    font-weight: 600;
    font-size: 0.9rem;
}

.event-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.event-coordinates {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: #999;
}

/* Form Styles */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

.form-control {
    width: 100%;
    padding: 12px;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
}

.form-control:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

textarea.form-control {
    resize: vertical;
    min-height: 100px;
}

/* Map Styles */
#map {
    height: 400px;
    border-radius: 15px;
    border: 3px solid #e9ecef;
    margin-bottom: 15px;
    overflow: hidden;
}

.map-instructions {
    background: linear-gradient(135deg, #74b9ff, #0984e3);
    color: white;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: 600;
}

.coordinates-display {
    background: #f8f9fa;
    padding: 10px;
    border-radius: 10px;
    font-family: 'Courier New', monospace;
    margin-bottom: 15px;
    text-align: center;
}

/* Utility Classes */
.text-center {
    text-align: center;
}

.text-muted {
    color: #666;
}

.hidden {
    display: none;
}

.mt-20 {
    margin-top: 20px;
}

.mb-20 {
    margin-bottom: 20px;
}

/* Loading spinner */
.spinner {
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top: 3px solid white;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
    display: inline-block;
    margin-right: 10px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Success/Error Messages */
.alert {
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 600;
}

.alert-success {
    background: linear-gradient(135deg, #d4edda, #c3e6cb);
    color: #155724;
    border: 1px solid #c3e6cb;
}

.alert-error {
    background: linear-gradient(135deg, #f8d7da, #f5c6cb);
    color: #721c24;
    border: 1px solid #f5c6cb;
}

/* Responsive design */
@media (max-width: 768px) {
    h1 {
        font-size: 2rem;
    }
    
    .nav-controls, .controls {
        flex-direction: column;
        align-items: center;
    }
    
    .btn {
        width: 100%;
        max-width: 300px;
    }
    
    .event-meta {
        flex-direction: column;
        align-items: flex-start;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 10px;
    }
    
    header, .main-content {
        padding: 20px;
    }
    
    h1 {
        font-size: 1.8rem;
    }
    
    #map {
        height: 300px;
    }
}
    </style>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>🏞️ Outdoor Events</h1>
            <p class="subtitle">Discover amazing outdoor activities near you</p>
        </header>

        <div class="nav-controls">
            <a href="{% url 'new-event' %}" class="btn btn-secondary">➕ Add New Event</a>
            <button class="btn btn-primary" id="refreshLocation">📍 Refresh Location</button>
        </div>

        <div class="location-status" id="locationStatus">
            <div class="spinner"></div>
            Requesting your location...
        </div>

        <div class="main-content">
            <h2 class="section-title">🎯 Events Near You</h2>
            
            <div class="controls mb-20">
                <button class="btn btn-primary" id="showNearby">📍 Show Nearby (50km)</button>
                <button class="btn btn-secondary" id="showAll">🌍 Show All Events</button>
            </div>
            
            <div class="events-list" id="eventsList">
                <!-- Events will be populated here -->
            </div>
            
            <div class="text-center">
                <small class="text-muted" id="eventsCount">Loading events...</small>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <script>
        class EventsListingApp {
            constructor() {
                this.userLocation = null;
                this.events = [];
                this.showingNearby = true;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.requestLocation();
                this.loadEvents();
            }

            setupEventListeners() {
                document.getElementById('refreshLocation').addEventListener('click', () => {
                    this.requestLocation();
                });

                document.getElementById('showNearby').addEventListener('click', () => {
                    this.showNearbyEvents();
                });

                document.getElementById('showAll').addEventListener('click', () => {
                    this.showAllEvents();
                });
            }

            requestLocation() {
                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status loading';
                statusEl.innerHTML = '<div class="spinner"></div> Requesting your location...';

                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => this.handleLocationSuccess(position),
                        (error) => this.handleLocationError(error),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
                    );
                } else {
                    this.handleLocationError({ message: 'Geolocation not supported' });
                }
            }

            handleLocationSuccess(position) {
                this.userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status success';
                statusEl.innerHTML = `📍 Location found: ${this.userLocation.lat.toFixed(4)}, ${this.userLocation.lng.toFixed(4)}`;

                if (this.showingNearby) {
                    this.displayNearbyEvents();
                } else {
                    this.displayAllEvents();
                }
            }

            handleLocationError(error) {
                console.error('Location error:', error);
                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status error';
                statusEl.innerHTML = '❌ Location access denied. Showing all events.';

                this.displayAllEvents();
            }

            async loadEvents() {
                try {
                    // Replace with your Django backend URL
                    const response = await fetch('/api/events/');
                    
                    if (response.ok) {
                        this.events = await response.json();
                    } else {
                        throw new Error('Failed to load events');
                    }
                } catch (error) {
                    console.error('Load events error:', error);
                    // Load sample events for demo
                    this.loadSampleEvents();
                }

                this.updateDisplay();
            }

            loadSampleEvents() {
                // Sample events for demonstration
                this.events = [
                    {
                        id: 1,
                        title: "Mountain Hiking Adventure",
                        description: "Join us for a breathtaking hike through the beautiful mountain trails with stunning views and fresh mountain air.",
                        latitude: -1.2500,
                        longitude: 36.8000,
                        created_at: "2025-09-07T10:00:00Z"
                    },
                    {
                        id: 2,
                        title: "Beach Volleyball Tournament",
                        description: "Competitive beach volleyball tournament. All skill levels welcome! Prizes for winners.",
                        latitude: -1.3500,
                        longitude: 36.9000,
                        created_at: "2025-09-06T14:30:00Z"
                    },
                    {
                        id: 3,
                        title: "Forest Nature Walk",
                        description: "Peaceful nature walk through ancient forest paths. Perfect for bird watching and photography.",
                        latitude: -1.2000,
                        longitude: 36.7500,
                        created_at: "2025-09-05T08:00:00Z"
                    },
                    {
                        id: 4,
                        title: "Rock Climbing Session",
                        description: "Beginner-friendly rock climbing with professional instructors and all equipment provided.",
                        latitude: -1.3000,
                        longitude: 36.8500,
                        created_at: "2025-09-04T16:00:00Z"
                    },
                    {
                        id: 5,
                        title: "Camping Under Stars",
                        description: "Weekend camping trip with stargazing, campfire stories, and outdoor cooking.",
                        latitude: -1.1800,
                        longitude: 36.7200,
                        created_at: "2025-09-03T12:00:00Z"
                    },
                    {
                        id: 6,
                        title: "Cycling Adventure",
                        description: "Scenic cycling route through countryside paths and local villages. Bikes available for rent.",
                        latitude: -1.4000,
                        longitude: 36.8800,
                        created_at: "2025-09-02T09:15:00Z"
                    }
                ];
            }

            showNearbyEvents() {
                this.showingNearby = true;
                document.getElementById('showNearby').classList.remove('btn-secondary');
                document.getElementById('showNearby').classList.add('btn-primary');
                document.getElementById('showAll').classList.remove('btn-primary');
                document.getElementById('showAll').classList.add('btn-secondary');
                
                this.updateDisplay();
            }

            showAllEvents() {
                this.showingNearby = false;
                document.getElementById('showAll').classList.remove('btn-secondary');
                document.getElementById('showAll').classList.add('btn-primary');
                document.getElementById('showNearby').classList.remove('btn-primary');
                document.getElementById('showNearby').classList.add('btn-secondary');
                
                this.updateDisplay();
            }

            updateDisplay() {
                if (this.showingNearby && this.userLocation) {
                    this.displayNearbyEvents();
                } else {
                    this.displayAllEvents();
                }
            }

            calculateDistance(lat1, lng1, lat2, lng2) {
                const R = 6371; // Earth's radius in km
                const dLat = this.toRad(lat2 - lat1);
                const dLng = this.toRad(lng2 - lng1);
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
                    Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            toRad(deg) {
                return deg * (Math.PI / 180);
            }

            displayNearbyEvents() {
                if (!this.userLocation) {
                    this.displayAllEvents();
                    return;
                }

                const nearbyEvents = this.events
                    .map(event => ({
                        ...event,
                        distance: this.calculateDistance(
                            this.userLocation.lat,
                            this.userLocation.lng,
                            event.latitude,
                            event.longitude
                        )
                    }))
                    .filter(event => event.distance <= 50) // 50km radius
                    .sort((a, b) => a.distance - b.distance);

                this.renderEvents(nearbyEvents, 'nearby');
            }

            displayAllEvents() {
                const eventsWithDistance = this.events.map(event => ({
                    ...event,
                    distance: this.userLocation ? 
                        this.calculateDistance(
                            this.userLocation.lat,
                            this.userLocation.lng,
                            event.latitude,
                            event.longitude
                        ) : null
                })).sort((a, b) => {
                    if (a.distance === null) return 1;
                    if (b.distance === null) return -1;
                    return a.distance - b.distance;
                });

                this.renderEvents(eventsWithDistance, 'all');
            }

            renderEvents(events, type) {
                const eventsListEl = document.getElementById('eventsList');
                const eventsCountEl = document.getElementById('eventsCount');
                
                if (events.length === 0) {
                    eventsListEl.innerHTML = `
                        <div class="text-center" style="padding: 40px;">
                            <h3>🔍 No events found ${type === 'nearby' ? 'nearby' : ''}</h3>
                            <p>${type === 'nearby' ? 
                                'No events within 50km of your location.' : 
                                'No events available at the moment.'}</p>
                            <a href="add-event.html" class="btn btn-secondary mt-20">
                                ➕ Be the first to add an event!
                            </a>
                        </div>
                    `;
                    eventsCountEl.textContent = 'No events found';
                    return;
                }

                eventsListEl.innerHTML = events.map(event => `
                    <div class="event-card">
                        <div class="event-title">${this.escapeHtml(event.title)}</div>
                        <div class="event-description">${this.escapeHtml(event.description)}</div>
                        <div class="event-meta">
                            <div class="event-distance">
                                ${event.distance !== null ? 
                                    `📍 ${event.distance.toFixed(1)} km away` : 
                                    '📍 Location unknown'}
                            </div>
                            <div class="event-coordinates">
                                ${event.latitude.toFixed(6)}, ${event.longitude.toFixed(6)}
                            </div>
                        </div>
                        ${event.created_at ? `
                            <div style="margin-top: 8px; font-size: 0.85rem; color: #999;">
                                🕒 Created: ${new Date(event.created_at).toLocaleDateString()}
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                // Update count display
                const countText = type === 'nearby' ? 
                    `${events.length} event(s) within 50km of your location` :
                    `${events.length} total event(s) available`;
                eventsCountEl.textContent = countText;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new EventsListingApp();
        });
    </script>
</body>
</html>
