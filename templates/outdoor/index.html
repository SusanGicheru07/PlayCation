<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Shared CSS -->
    <style>
        /* Futuristic blue/purple theme with white text */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(ellipse at top, #1a1d3a 0%, #0f1123 50%, #050812 100%);
    background-attachment: fixed;

    color: #ffffff;
    position: relative;
    overflow-x: hidden;
}

/* Futuristic animated background */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 25% 25%, #3b82f6 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, #8b5cf6 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #06b6d4 0%, transparent 70%);
    opacity: 0.1;
    animation: pulse 8s ease-in-out infinite alternate;
    z-index: -2;
}

body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        linear-gradient(45deg, transparent 40%, rgba(59, 130, 246, 0.03) 50%, transparent 60%),
        linear-gradient(-45deg, transparent 40%, rgba(139, 92, 246, 0.03) 50%, transparent 60%);
    animation: scan 10s linear infinite;
    z-index: -1;
}

@keyframes pulse {
    0% { opacity: 0.05; transform: scale(1); }
    100% { opacity: 0.15; transform: scale(1.1); }
}

@keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

}

header {
    text-align: center;

    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 20px;
    padding: 40px;
  
    box-shadow: 
        0 0 40px rgba(59, 130, 246, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);

}

headerhhh::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;

.location-status {

<body>
    <div class="container">
    <header>
      <h1 style="color: white;">🏞️ Outdoor Events</h1>
      <p class="subtitle">Discover amazing outdoor activities near you</p>
    </header>

    <div class="nav-controls" style="text-align:center; margin-bottom:25px;">
      <a href="{% url 'new-event' %}" class="btn btn-secondary">➕ Add Event</a>
      <button class="btn btn-primary" id="refreshLocation">📍 Refresh Location</button>
    </div>

    <div class="location-status loading" id="locationStatus">
      <span>Requesting your location...</span>
    </div>

    <div class="main-content">
      <h2 class="section-title">🎯 Events Near You</h2>
      <div style="text-align:center; margin-bottom:20px;">
        <button class="btn btn-primary" id="showNearby">📍 Show Nearby (35km)</button>
        <button class="btn btn-secondary" id="showAll">🌍 Show All</button>
      </div>

      <div class="events-list" id="eventsList"></div>
      <div style="text-align:center; margin-top:10px;">
        <small id="eventsCount">Loading events...</small>
      </div>
    </div>
  </div>


    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <script>
        class EventsListingApp {
            constructor() {
                this.userLocation = null;
                this.events = [];
                this.showingNearby = true;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.requestLocation();
                this.loadEvents();
            }

            setupEventListeners() {
                document.getElementById('refreshLocation').addEventListener('click', () => {
                    this.requestLocation();
                });

                document.getElementById('showNearby').addEventListener('click', () => {
                    this.showNearbyEvents();
                });

                document.getElementById('showAll').addEventListener('click', () => {
                    this.showAllEvents();
                });
            }

            requestLocation() {
                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status loading';
                statusEl.innerHTML = '<div class="spinner"></div> Requesting your location...';

                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => this.handleLocationSuccess(position),
                        (error) => this.handleLocationError(error),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
                    );
                } else {
                    this.handleLocationError({ message: 'Geolocation not supported' });
                }
            }

            handleLocationSuccess(position) {
                this.userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status success';
                statusEl.innerHTML = `📍 Location found: ${this.userLocation.lat.toFixed(4)}, ${this.userLocation.lng.toFixed(4)}`;

                if (this.showingNearby) {
                    this.displayNearbyEvents();
                } else {
                    this.displayAllEvents();
                }
            }

            handleLocationError(error) {
                console.error('Location error:', error);
                const statusEl = document.getElementById('locationStatus');
                statusEl.className = 'location-status error';
                statusEl.innerHTML = '❌ Location access denied. Showing all events.';

                this.displayAllEvents();
            }

            async loadEvents() {
                try {
                    // Replace with your Django backend URL
                    const response = await fetch('/api/events/');
                    
                    if (response.ok) {
                        this.events = await response.json();
                    } else {
                        throw new Error('Failed to load events');
                    }
                } catch (error) {
                    console.error('Load events error:', error);
                    // Load sample events for demo
                    this.loadSampleEvents();
                }

                this.updateDisplay();
            }

            loadSampleEvents() {
                // Sample events for demonstration
                this.events = [
                    {
                        id: 6,
                        title: "Cycling Adventure",
                        description: "Scenic cycling route through countryside paths and local villages. Bikes available for rent.",
                        latitude: -1.4000,
                        longitude: 36.8800,
                        created_at: "2025-09-02T09:15:00Z"
                    }
                ];
            }

            showNearbyEvents() {
                this.showingNearby = true;
                document.getElementById('showNearby').classList.remove('btn-secondary');
                document.getElementById('showNearby').classList.add('btn-primary');
                document.getElementById('showAll').classList.remove('btn-primary');
                document.getElementById('showAll').classList.add('btn-secondary');
                
                this.updateDisplay();
            }

            showAllEvents() {
                this.showingNearby = false;
                document.getElementById('showAll').classList.remove('btn-secondary');
                document.getElementById('showAll').classList.add('btn-primary');
                document.getElementById('showNearby').classList.remove('btn-primary');
                document.getElementById('showNearby').classList.add('btn-secondary');
                
                this.updateDisplay();
            }

            updateDisplay() {
                if (this.showingNearby && this.userLocation) {
                    this.displayNearbyEvents();
                } else {
                    this.displayAllEvents();
                }
            }

            calculateDistance(lat1, lng1, lat2, lng2) {
                const R = 6371; // Earth's radius in km
                const dLat = this.toRad(lat2 - lat1);
                const dLng = this.toRad(lng2 - lng1);
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
                    Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            toRad(deg) {
                return deg * (Math.PI / 180);
            }

            displayNearbyEvents() {
                if (!this.userLocation) {
                    this.displayAllEvents();
                    return;
                }

                const nearbyEvents = this.events
                    .map(event => ({
                        ...event,
                        distance: this.calculateDistance(
                            this.userLocation.lat,
                            this.userLocation.lng,
                            event.latitude,
                            event.longitude
                        )
                    }))
                    .filter(event => event.distance <= 35) // 35km radius
                    .sort((a, b) => a.distance - b.distance);

                this.renderEvents(nearbyEvents, 'nearby');
            }

            displayAllEvents() {
                const eventsWithDistance = this.events.map(event => ({
                    ...event,
                    distance: this.userLocation ? 
                        this.calculateDistance(
                            this.userLocation.lat,
                            this.userLocation.lng,
                            event.latitude,
                            event.longitude
                        ) : null
                })).sort((a, b) => {
                    if (a.distance === null) return 1;
                    if (b.distance === null) return -1;
                    return a.distance - b.distance;
                });

                this.renderEvents(eventsWithDistance, 'all');
            }

            renderEvents(events, type) {
                const eventsListEl = document.getElementById('eventsList');
                const eventsCountEl = document.getElementById('eventsCount');
                
                if (events.length === 0) {
                    eventsListEl.innerHTML = `
                        <div class="empty-state">
                            <h3>🔍 No events found ${type === 'nearby' ? 'nearby' : ''}</h3>
                            <p>${type === 'nearby' ? 
                                'No events within 35km of your location.' : 
                                'No events available at the moment.'}</p>
                            <a href="/new-event/" class="btn btn-secondary mt-20">
                                ➕ Be the first to add an event!
                            </a>
                        </div>
                    `;
                    eventsCountEl.textContent = 'No events found';
                    return;
                }

                eventsListEl.innerHTML = events.map(event => `
                    <div class="event-card">
                        <div class="event-title">${this.escapeHtml(event.title)}</div>
                        <div class="event-description">${this.escapeHtml(event.description)}</div>
                        <div class="event-meta">
                            <div class="event-distance">
                                ${event.distance !== null ? 
                                    `📍 ${event.distance.toFixed(1)} km away` : 
                                    '📍 Location unknown'}
                            </div>
                            <div class="event-coordinates">
                                ${event.latitude.toFixed(6)}, ${event.longitude.toFixed(6)}
                            </div>
                        </div>
                        ${event.created_at ? `
                            <div style="margin-top: 12px; font-size: 0.9rem; color: #94a3b8;">
                                🕒 Created: ${new Date(event.created_at).toLocaleDateString()}
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                // Update count display
                const countText = type === 'nearby' ? 
                    `${events.length} event(s) within 35km of your location` :
                    `${events.length} total event(s) available`;
                eventsCountEl.textContent = countText;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new EventsListingApp();
        });
    </script>
</body>
</html>
