<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCation</title>

    <!--import lecend font -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
    </style>

    <main>
        <section>
            <div class="page-describ">
                <h1>Game Input</h1>
                <p>Enough of guessing, lets see what you came up with.</p>
            </div>

            <div class="page-content">
                <form method="POST" action="{% url 'handle_guesses' round_id=round.id %}" id="guessForm">
                    {% csrf_token %}
                    <div>
                        <label>Person 1 Guess:</label>
                        <input type="text" name="guess1" required>
                    </div>
                    <div>
                        <label>Person 2 Guess:</label>
                        <input type="text" name="guess2" required>
                    </div>
                    <div>
                        <label>Person 3 Guess:</label>
                        <input type="text" name="guess3" required>
                    </div>
                    <button type="submit">Submit Guesses</button>
                </form>
            </div>
        </section>
    </main>

<!-- Popup Modal -->
<div id="popup" style="
    display:none; 
    position:fixed; 
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.6);
    justify-content:center; 
    align-items:center;
">
    <div style="
        background:grey;
        color:white; 
        padding:20px; 
        border-radius:10px; 
        text-align:center;
    ">
        <h2 id="popupMessage"></h2>
        <button onclick="closePopup()">Close</button>
        <a href="{% url 'start_game' game.id%}">Go back to game details</a>
    </div>
</div>

<script>
    const form = document.getElementById("guessForm");
    const popup = document.getElementById("popup");
    const popupMessage = document.getElementById("popupMessage");

    form.addEventListener("submit", async function(event) {
        event.preventDefault(); // prevent page reload

        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: "POST",
                headers: {
                    "X-CSRFToken": formData.get("csrfmiddlewaretoken")
                },
                body: formData
            });

            const data = await response.json();

            // Show popup message
            popupMessage.innerText = data.message;
            popup.style.display = "flex";

        } catch (error) {
            popupMessage.innerText = "An error occurred. Please try again.";
            popup.style.display = "flex";
        }
    });

    function closePopup() {
        popup.style.display = "none";
    }
</script>
