{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCation</title>

     <!--import lecend font -->
     <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

     <!--import css -->
     <link rel="stylesheet" href="{% static 'indoor/css/main.css' %}">

    <style>
        body{
            margin:0;
            padding: 2px;
            background: #f8f9fa;
            width: 100vw;
            height: 100vh;
            display: flex; 
            align-items: center;
            font-family: 'Lexend', sans-serif;
            flex-direction: row;
        }
        main{
            display: flex;
            width: 100%;
            height: 100%;
            border-radius: 0;
            background: transparent;
            overflow: hidden;
            flex-direction:column;
            margin-left: 20px;
            margin-top: 2rem;
        }
        .page-content{
            margin-top: 4rem;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 300px;
        }
        input{
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            font-family: 'Lexend', sans-serif;
            width: 200px;
            height: 30px;
        }
        button{
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 150px;
            height: 40px;
        }
    </style>
</head>
<body>
        {% include 'sidebar.html' %}

        <main>
            <section>
                <div class="page-describ">
                    <button onclick="window.history.back()" class="back-btn">⬅ Back</button>
                    <h1>Start a round: </h1>
                    <p>Lets get started. Answer the form below and START A ROUND !!!!</p>
                </div>
            </section>

            <section class="page-content">
                <form method="POST" action="{% url 'add_round' game.id %}">
                    {% csrf_token %}
                    
                    {% if game.type|lower == "charades" %}
                        <div class="form-group">
                            <label for="hint">Charades Hint:</label>
                            <input type="text" 
                                   id="hint" 
                                   name="hint" 
                                   placeholder="Enter the word or phrase to act out..."
                                   required>
                            
                            <label for="team">Select Team:</label>
                            <select name="team" required>
                                {% for team in teams %}
                                    <option value="{{ team.id }}">{{ team.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                    {% elif game.type|lower == "singing" %}
                        <div class="form-group">
                            <label for="song_title">Song Title (or "Free Style"):</label>
                            <input type="text" 
                                   id="song_title" 
                                   name="song_title" 
                                   placeholder="Enter song title or leave as Free Style..."
                                   value="Free Style">

                            <label for="team">Select Team:</label>
                                <select name="team" required>
                                    {% for team in teams %}
                                        <option value="{{ team.id }}">{{ team.name }}</option>
                                    {% endfor %}
                                </select>
                        </div>
                        
                    {% endif %}
        
                    <button type="submit" class="btn">
                        {% if game.type|lower ==  "charades" %}
                            Create Charades Round
                        {% elif game.type|lower == "singing" %}
                            Start Singing Round
                        {% endif %}
                    </button>
                    
                    <a href="{% url 'start_game' game.id %}" class="btn btn-secondary">Cancel</a>
                    </form>
            </section>

        </main>            
  
</body>
</html>
